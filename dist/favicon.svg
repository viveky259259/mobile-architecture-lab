<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">MAL light theme icon</title>
  <desc id="desc">Light theme Mobile Architecture Lab icon with architecture diagram strokes.</desc>
  <defs>
    <linearGradient id="tile-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.58" stop-color="#F4F8FF"/>
      <stop offset="1" stop-color="#EAF2FC"/>
    </linearGradient>
    <radialGradient id="halo-light" cx="0.48" cy="0.34" r="0.72">
      <stop offset="0" stop-color="#A77BFF" stop-opacity="0.18"/>
      <stop offset="0.48" stop-color="#3DA8F5" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#3DA8F5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots-light" width="58" height="58" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#42526A" fill-opacity="0.08"/>
    </pattern>
    <clipPath id="tileclip-light">
      <rect x="112" y="112" width="800" height="800" rx="196"/>
    </clipPath>
    <filter id="soft-shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#07111F" flood-opacity="0.14"/>
    </filter>
    <filter id="rough-light" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="112" y="112" width="800" height="800" rx="196" fill="url(#tile-light)" filter="url(#soft-shadow)"/>
  <g clip-path="url(#tileclip-light)">
    <rect x="112" y="112" width="800" height="800" fill="url(#dots-light)"/>
    <rect x="112" y="112" width="800" height="800" fill="url(#halo-light)"/>
  </g>
  <rect x="116.5" y="116.5" width="791" height="791" rx="191.5" fill="none" stroke="#C9D6E6" stroke-width="3"/>
  <g fill="none" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough-light)">
    <path d="M476 324 C 452 432 430 520 354 650" stroke="#1683E8"/>
    <path d="M388 614 L354 650 L350 600" stroke="#1683E8"/>
    <path d="M548 324 C 572 432 594 520 670 650" stroke="#E85F45"/>
    <path d="M674 600 L670 650 L636 614" stroke="#E85F45"/>
    <path d="M414 500 C 470 492 554 508 610 500" stroke="#8257E8"/>
    <path d="M449 481 L414 500 L449 519" stroke="#8257E8"/>
    <path d="M575 481 L610 500 L575 519" stroke="#8257E8"/>
  </g>
  <g>
    <rect x="420" y="214" width="184" height="104" rx="26" fill="#FFFFFF" stroke="#C8D4E3" stroke-width="3"/>
    <circle cx="452" cy="246" r="9" fill="#8257E8"/>
    <rect x="472" y="240" width="104" height="12" rx="6" fill="#53627A" fill-opacity="0.48"/>
    <rect x="448" y="276" width="128" height="11" rx="5.5" fill="#53627A" fill-opacity="0.26"/>
  </g>
  <g>
    <rect x="208" y="660" width="184" height="104" rx="26" fill="#FFFFFF" stroke="#C8D4E3" stroke-width="3"/>
    <circle cx="240" cy="692" r="9" fill="#1683E8"/>
    <rect x="260" y="686" width="104" height="12" rx="6" fill="#53627A" fill-opacity="0.48"/>
    <rect x="236" y="722" width="128" height="11" rx="5.5" fill="#53627A" fill-opacity="0.26"/>
  </g>
  <g>
    <rect x="632" y="660" width="184" height="104" rx="26" fill="#FFFFFF" stroke="#C8D4E3" stroke-width="3"/>
    <circle cx="664" cy="692" r="9" fill="#E85F45"/>
    <rect x="684" y="686" width="104" height="12" rx="6" fill="#53627A" fill-opacity="0.48"/>
    <rect x="660" y="722" width="128" height="11" rx="5.5" fill="#53627A" fill-opacity="0.26"/>
  </g>
</svg>
