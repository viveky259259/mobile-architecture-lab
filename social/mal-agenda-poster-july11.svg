    <g transform="translate(240 30)">
      <rect x="0" y="0" width="216" height="112" rx="20" fill="#FFFFFF"/>
      <text x="108" y="25" text-anchor="middle" fill="#677487" font-family="JetBrains Mono, Menlo, monospace" font-size="10" font-weight="800" letter-spacing="2.8">F&amp;B</text>
      <image href="../logo/google-for-developers-logo-lockup.png" x="18" y="51" width="180" height="24" preserveAspectRatio="xMidYMid meet"/>
      <text x="108" y="98" text-anchor="middle" fill="#42526A" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">Google for Developers</text>
    </g>
    <g transform="translate(480 30)">
      <rect x="0" y="0" width="216" height="112" rx="20" fill="#FFFFFF"/>
      <text x="108" y="25" text-anchor="middle" fill="#677487" font-family="JetBrains Mono, Menlo, monospace" font-size="10" font-weight="800" letter-spacing="2.8">COMMUNITY</text>
      <image href="../logo/flutter-mumbai.png" x="43" y="43" width="48" height="48" preserveAspectRatio="xMidYMid meet"/>
      <text x="105" y="62" fill="#07111F" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900">Flutter</text>
      <text x="105" y="84" fill="#42526A" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900">Mumbai</text>
    </g>
    <g transform="translate(720 30)">
      <rect x="0" y="0" width="216" height="112" rx="20" fill="#0A0F1D" stroke="rgba(255,255,255,0.16)"/>
      <text x="108" y="25" text-anchor="middle" fill="#8FA2C0" font-family="JetBrains Mono, Menlo, monospace" font-size="10" font-weight="800" letter-spacing="2.8">COMMUNITY</text>
      <image href="../logo/flutterflow-logo.svg" x="28" y="49" width="160" height="43" preserveAspectRatio="xMidYMid meet"/>
      <text x="108" y="99" text-anchor="middle" fill="#A8B4CC" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">Developer Group Mumbai</text>
