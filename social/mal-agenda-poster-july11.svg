      <g transform="translate(30 176)">
        <rect x="0" y="0" width="190" height="46" rx="16" fill="rgba(61,168,245,0.16)" stroke="rgba(61,168,245,0.34)"/>
        <text x="95" y="31" text-anchor="middle" fill="#3DA8F5">11:30-12:15</text>
        <text x="224" y="31" fill="#F3F7FF">Sourav - Accessibility</text>
      </g>
      <g transform="translate(30 236)">
