      <g transform="translate(30 296)">
        <rect x="0" y="0" width="190" height="46" rx="16" fill="rgba(255,122,92,0.16)" stroke="rgba(255,122,92,0.34)"/>
        <text x="95" y="31" text-anchor="middle" fill="#FF7A5C">1:00-1:20</text>
        <text x="224" y="31" fill="#F3F7FF">MAL activity</text>
      </g>
      <g transform="translate(30 356)">
        <rect x="0" y="0" width="190" height="46" rx="16" fill="rgba(94,230,168,0.14)" stroke="rgba(94,230,168,0.30)"/>
        <text x="95" y="31" text-anchor="middle" fill="#5EE6A8">1:20-1:45</text>
        <text x="224" y="31" fill="#F3F7FF">Lunch</text>
      </g>
      <g transform="translate(30 416)">
        <rect x="0" y="0" width="190" height="46" rx="16" fill="rgba(61,168,245,0.16)" stroke="rgba(61,168,245,0.34)"/>
        <text x="95" y="31" text-anchor="middle" fill="#3DA8F5">1:45-2:30</text>
        <text x="224" y="31" fill="#F3F7FF">Geeta - Local AI</text>
      </g>
      <g transform="translate(30 476)">
        <rect x="0" y="0" width="190" height="46" rx="16" fill="rgba(167,123,255,0.16)" stroke="rgba(167,123,255,0.34)"/>
        <text x="95" y="31" text-anchor="middle" fill="#A77BFF">2:30-3:15</text>
        <text x="224" y="31" fill="#F3F7FF">Vishal - Security</text>
      </g>
      <g transform="translate(30 536)">
        <rect x="0" y="0" width="190" height="46" rx="16" fill="rgba(255,122,92,0.16)" stroke="rgba(255,122,92,0.34)"/>
        <text x="95" y="31" text-anchor="middle" fill="#FF7A5C">3:15-3:30</text>
        <text x="224" y="31" fill="#F3F7FF">Wrap-up, photos, next event announcement</text>
