<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Mobile Architecture Lab Lab 1 agenda poster</title>
  <desc id="desc">Poster for Mobile Architecture Lab Lab 1 with Measure as title sponsor, agenda in the center, and partners at the bottom.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A12"/>
      <stop offset="0.52" stop-color="#0B1530"/>
      <stop offset="1" stop-color="#122440"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DA8F5"/>
      <stop offset="0.52" stop-color="#A77BFF"/>
      <stop offset="1" stop-color="#FF7A5C"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.82" cy="0.08" r="0.7">
      <stop offset="0" stop-color="#3DA8F5" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3DA8F5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.08" cy="0.82" r="0.7">
      <stop offset="0" stop-color="#A77BFF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#A77BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#glowBlue)"/>
  <rect width="1080" height="1350" fill="url(#glowPurple)"/>

  <g opacity="0.18">
    <path d="M-80 286 H1160" stroke="#F3F7FF" stroke-width="1"/>
    <path d="M-80 1095 H1160" stroke="#F3F7FF" stroke-width="1"/>
    <path d="M108 -40 V1410" stroke="#F3F7FF" stroke-width="1"/>
    <path d="M972 -40 V1410" stroke="#F3F7FF" stroke-width="1"/>
    <path d="M0 1122 C 108 1080, 192 1120, 306 1086 C 430 1048, 538 1108, 666 1075 C 808 1039, 932 1075, 1080 1038 L1080 1350 L0 1350 Z" fill="#000000"/>
  </g>

  <g transform="translate(72 50)">
