    <text x="32" y="43" fill="#8FA2C0" font-family="JetBrains Mono, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="5">TITLE SPONSOR</text>
    <rect x="32" y="58" width="300" height="52" rx="18" fill="#FFFFFF"/>
    <image href="../logo/measure-logo-color.png" x="50" y="67" width="34" height="34" preserveAspectRatio="xMidYMid meet"/>
    <text x="102" y="94" fill="#07111F" font-family="Sora, Inter, Arial, sans-serif" font-size="33" font-weight="800">Measure</text>
    <rect x="594" y="33" width="306" height="66" rx="20" fill="rgba(94,230,168,0.10)" stroke="rgba(94,230,168,0.24)"/>
    <text x="747" y="62" text-anchor="middle" fill="#DDE8F8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Open-source mobile</text>
    <text x="747" y="87" text-anchor="middle" fill="#8FA2C0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">observability platform</text>
  </g>

  <g transform="translate(72 232)">
    <text x="0" y="0" fill="#C7D0E2" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="4">MUMBAI ARCHITECTURE LAB</text>
    <text x="0" y="76" fill="#F3F7FF" font-family="Sora, Inter, Arial, sans-serif" font-size="72" font-weight="800">MAL Lab 1</text>
