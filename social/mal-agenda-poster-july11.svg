      <text x="108" y="25" text-anchor="middle" fill="#677487" font-family="JetBrains Mono, Menlo, monospace" font-size="10" font-weight="800" letter-spacing="2.8">VENUE</text>
      <text x="40" y="76" fill="#002E6E" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="900">Pay</text>
      <text x="118" y="76" fill="#00BAF2" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="900">tm</text>
      <text x="108" y="98" text-anchor="middle" fill="#42526A" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">Paytm, Mumbai</text>
