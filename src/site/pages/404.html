<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page not found — Mobile Architecture Lab</title>
  <style>
    :root { color-scheme: dark; --bg: #070a12; --ink: #f3f7ff; --muted: #a8b4cc; --flutter: #3da8f5; --swift: #ff7a5c; --kotlin: #a77bff; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 Inter, system-ui, sans-serif; }
    main { width: min(640px, calc(100% - 48px)); text-align: center; }
    .code { margin: 0; color: var(--flutter); font: 700 14px/1 JetBrains Mono, monospace; letter-spacing: .16em; }
    h1 { margin: 18px 0 12px; font: 800 clamp(40px, 9vw, 76px)/1.02 Sora, system-ui, sans-serif; letter-spacing: -.04em; }
    p { margin: 0 auto 28px; max-width: 42ch; color: var(--muted); }
    a { display: inline-block; padding: 12px 18px; border-radius: 999px; background: linear-gradient(110deg, var(--flutter), var(--kotlin) 50%, var(--swift)); color: #07111f; font-weight: 800; text-decoration: none; }
    a:focus-visible { outline: 3px solid white; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404 · ROUTE NOT FOUND</p>
    <h1>That page is not part of the lab.</h1>
    <p>Return to Mobile Architecture Lab to find the current programme, assignments, and event information.</p>
    <a href="/">Return home</a>
  </main>
</body>
</html>
