<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">MAL Lab 1 LinkedIn event poster</title>
  <desc id="desc">LinkedIn poster for MAL Lab 1 on 11 July 2026 in Mumbai during monsoon week.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.48" stop-color="#0B1530"/>
      <stop offset="1" stop-color="#17233B"/>
    </linearGradient>
    <linearGradient id="rain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ECFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8ECFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DA8F5"/>
      <stop offset="0.55" stop-color="#A77BFF"/>
      <stop offset="1" stop-color="#FF7A5C"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.68" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#3DA8F5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3DA8F5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.12" cy="0.94" r="0.62">
      <stop offset="0" stop-color="#A77BFF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#A77BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>
